<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family 100 - Kuis SD Berjenjang</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: white;
            overflow: hidden; /* Prevent scrolling for projector view */
            user-select: none;
        }

        /* 3D Card Flip Styles */
        .perspective {
            perspective: 1000px;
        }
        .preserve-3d {
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-x-180 {
            transform: rotateX(180deg);
        }
        
        /* Board specific styling */
        .board-container {
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.3) inset;
            border: 4px solid #3b82f6;
            background-color: rgba(15, 23, 42, 0.8);
        }

        /* Animations */
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        
        .animate-pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }

        .point-float {
            position: absolute;
            color: #4ade80; /* green-400 */
            font-weight: 900;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.8);
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 50;
        }

        /* Team Active Glow */
        .team-active {
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.6); /* Yellow glow */
            border-color: #facc15 !important;
            transform: scale(1.02);
            transition: all 0.3s ease;
        }
        .team-inactive {
            opacity: 0.7;
            filter: grayscale(40%);
            transition: all 0.3s ease;
        }

        /* Strike Indicator */
        .strike-x {
            opacity: 0.25;
            filter: grayscale(100%);
            transition: all 0.3s ease;
        }
        .strike-x.active {
            opacity: 1;
            filter: grayscale(0%) drop-shadow(0 0 10px rgba(239, 68, 68, 0.8));
        }

        /* Big X Overlay */
        #big-x-overlay {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        /* Custom Scrollbar for input area if needed */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col font-sans">

    <!-- BGM Audio Element -->
    <audio id="bgm-audio" loop>
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <!-- Toggle BGM Button (Kiri Atas) -->
    <button onclick="toggleBGM()" id="btn-bgm" title="Toggle Musik" class="absolute top-4 left-4 bg-teal-700/90 hover:bg-teal-600 text-white font-bold px-4 py-3 rounded-xl border border-gray-600 hover:border-teal-400 shadow-lg z-[100] transition-all">

        </svg>
    </button>

    <!-- Confetti Layer (Hidden initially) -->

    <!-- BIG X Overlay -->
    <div id="big-x-overlay" class="text-red-600 font-black text-[20vw] drop-shadow-[0_0_50px_rgba(220,38,38,1)] leading-none">
        ❌
    </div>

    <!-- TURN POPUP OVERLAY -->
    <div id="turn-popup" class="fixed inset-0 flex items-center justify-center pointer-events-none z-[80] hidden">

    </div>

    <!-- SUBJECT SELECTION MODAL -->

            FAMILY 100 SD
        </h1>
        <p class="text-2xl text-blue-300 font-bold mb-10 tracking-widest bg-blue-900/50 inline-block px-8 py-2 rounded-full border border-blue-500/30 text-center">PILIH MATA PELAJARAN</p>
        <div class="flex flex-wrap justify-center gap-6 max-w-5xl w-full px-4">
            <button onclick="selectSubject('ipas')" class="w-[30%] min-w-[250px] bg-gradient-to-b from-green-500 to-green-700 hover:from-green-400 hover:to-green-600 text-white font-black text-4xl py-10 rounded-3xl shadow-[0_10px_0_#14532d] hover:shadow-[0_5px_0_#14532d] hover:translate-y-[5px] transition-all border-4 border-green-300">IPAS</button>
            <button onclick="selectSubject('indonesia')" class="w-[30%] min-w-[250px] bg-gradient-to-b from-red-500 to-red-700 hover:from-red-400 hover:to-red-600 text-white font-black text-4xl py-10 rounded-3xl shadow-[0_10px_0_#7f1d1d] hover:shadow-[0_5px_0_#7f1d1d] hover:translate-y-[5px] transition-all border-4 border-red-300">B. INDO</button>
            <button onclick="selectSubject('matematika')" class="w-[30%] min-w-[250px] bg-gradient-to-b from-blue-500 to-blue-700 hover:from-blue-400 hover:to-blue-600 text-white font-black text-4xl py-10 rounded-3xl shadow-[0_10px_0_#1e3a8a] hover:shadow-[0_5px_0_#1e3a8a] hover:translate-y-[5px] transition-all border-4 border-blue-300">MTK</button>

        </div>
    </div>

    <!-- MAIN GAME AREA -->
    <div class="flex-1 flex flex-col p-4 pb-0 h-[calc(100vh-160px)] hidden" id="main-game-area">
        
        <!-- Header -->

        <!-- Play Area (Teams & Board) -->

                    <span id="t1-strike-2" class="strike-x text-5xl font-black">❌</span>
                    <span id="t1-strike-3" class="strike-x text-5xl font-black">❌</span>

            </div>

                <!-- Answers List -->

                    <!-- Cards will be generated here by JS -->
                </div>
            </div>

            <!-- TEAM 2 PANEL -->
            <div id="team2-panel" class="w-1/4 bg-gray-800 border-4 border-gray-600 rounded-2xl flex flex-col items-center justify-center p-4 relative team-inactive">

            </div>

                </button>
                <button onclick="resetStrikes()" class="bg-gray-600 hover:bg-gray-500 text-white font-bold px-4 py-2 rounded shadow border-b-2 border-gray-800">
                    Reset ❌
                </button>
                <button onclick="revealAllNoPoints()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded shadow border-b-2 border-indigo-800">
                    Buka Semua
                </button>
            </div>

            <!-- Game Flow Controls -->
            <div class="flex gap-3">
                <button onclick="showGradeSelection()" class="bg-blue-800 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-sm border-b-2 border-blue-900 shadow">
                    ☰ Ganti Mapel
                </button>
                <button onclick="nextQuestion()" id="btn-next" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-6 py-2 rounded-xl shadow-lg border-b-4 border-purple-800 animate-pulse">

                </button>
                <button onclick="resetGameModal()" class="bg-gray-700 hover:bg-gray-600 text-gray-300 font-bold px-3 py-2 rounded-xl text-sm border-b-2 border-gray-900">
                    Reset Game
                </button>
            </div>
        </div>
    </div>

    <!-- WIN/END GAME MODAL -->
    <div id="win-modal" class="fixed inset-0 bg-black/90 hidden z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="bg-gradient-to-b from-gray-800 to-gray-900 border-4 border-yellow-500 rounded-3xl p-10 flex flex-col items-center shadow-[0_0_100px_rgba(234,179,8,0.5)] transform scale-0 transition-transform duration-500" id="win-modal-content">

            </h2>
            <p class="text-xl text-gray-300 mb-8 font-semibold tracking-widest">HASIL AKHIR</p>
            
            <div class="flex gap-12 mb-10 w-full justify-center">

                    <div id="final-score-1" class="text-6xl font-black text-white drop-shadow-md">0</div>

                    <h3 class="text-2xl text-rose-400 font-bold mb-2">TIM 2</h3>
                    <div id="final-score-2" class="text-6xl font-black text-white drop-shadow-md">0</div>

            </div>

            <div id="winner-announcement" class="text-5xl font-black text-white mb-10 animate-bounce text-center drop-shadow-[0_0_20px_rgba(255,255,255,0.8)]">
                TIM 1 MENANG!
            </div>

            <button onclick="resetGame()" class="bg-yellow-500 hover:bg-yellow-400 text-yellow-900 font-black text-2xl px-10 py-4 rounded-xl shadow-[0_5px_0_#a16207] hover:shadow-[0_2px_0_#a16207] hover:translate-y-[3px] transition-all">
                MAIN LAGI
            </button>
        </div>
    </div>

        const elT2Score = document.getElementById('team2-score');
        const elT1Panel = document.getElementById('team1-panel');
        const elT2Panel = document.getElementById('team2-panel');

        /* --- BACKGROUND MUSIC LOGIC --- */
        let isBgmPlaying = false;
        const bgmAudio = document.getElementById('bgm-audio');
        bgmAudio.volume = 0.60; // Volume dinaikkan menjadi 60% agar lebih terdengar

        function toggleBGM() {
            const btnBgm = document.getElementById('btn-bgm');
            if (isBgmPlaying) {
                bgmAudio.pause();
                isBgmPlaying = false;
                btnBgm.innerText = "🎵 Musik: OFF";
                btnBgm.classList.replace('bg-teal-500', 'bg-teal-700');
            } else {
                bgmAudio.play().catch(e => {
                    alert("Musik tidak ditemukan! Pastikan file bgm.mp3 berada di folder yang sama dengan file HTML.");
                    console.log("BGM Play failed:", e);
                });
                isBgmPlaying = true;
                btnBgm.innerText = "🎵 Musik: ON";
                btnBgm.classList.replace('bg-teal-700', 'bg-teal-500');
            }
        }

        /* --- AUDIO SYNTHESIS (Web Audio API) --- */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        function playCorrectSound() {
            playTone(523.25, 'sine', 0.1, 0.2); // C5
            setTimeout(() => playTone(659.25, 'sine', 0.1, 0.2), 100); // E5
            setTimeout(() => playTone(783.99, 'sine', 0.3, 0.2), 200); // G5
        }

        function playWrongSound() {
            playTone(150, 'sawtooth', 0.4, 0.3);
            setTimeout(() => playTone(140, 'sawtooth', 0.4, 0.3), 100);
        }

        function playWinSound() {
            const notes = [
                {f: 440, d: 0.2}, {f: 440, d: 0.2}, {f: 440, d: 0.2},
                {f: 587.33, d: 0.4}, {f: 523.25, d: 0.4}, {f: 659.25, d: 0.8}
            ];
            let time = 0;
            notes.forEach(note => {
                setTimeout(() => playTone(note.f, 'square', note.d, 0.15), time * 1000);
                time += note.d;
            });
        }

        /* --- GRADE SELECTION & INITIALIZATION --- */
        function showGradeSelection() {
            document.getElementById('grade-modal').classList.remove('hidden');
            document.getElementById('main-game-area').classList.add('hidden');
            document.getElementById('win-modal').classList.add('hidden');
            stopConfetti();
        }

        function selectSubject(subjectKey) {
            currentSubject = subjectKey;
            
            // Fisher-Yates Shuffle untuk mengacak 10 soal
            let allQuestions = [...questionsBank[subjectKey]];
            for (let i = allQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allQuestions[i], allQuestions[j]] = [allQuestions[j], allQuestions[i]];
            }
            
            // Ambil 5 soal pertama yang sudah diacak
            questionsData = allQuestions.slice(0, 5);
            
            // Mapping nama mapel untuk UI
            const subjectNames = {
                'ipas': 'ILMU PENGETAHUAN ALAM & SOSIAL (IPAS)',
                'indonesia': 'BAHASA INDONESIA',
                'matematika': 'MATEMATIKA',
                'pkn': 'PENDIDIKAN PANCASILA (PKN)',
                'inggris': 'BAHASA INGGRIS'
            };
            
            // Update UI Title
            document.getElementById('grade-subtitle').innerText = `MATA PELAJARAN: ${subjectNames[subjectKey]}`;
            
            // Hide Modal, Show Game
            document.getElementById('grade-modal').classList.add('hidden');
            document.getElementById('main-game-area').classList.remove('hidden');
            
            initGame();
        }

        /* --- INITIALIZATION & RENDERING --- */
        function initGame() {
            currentQuestionIndex = 0;
            team1Score = 0;
            team2Score = 0;
            activeTeam = 1;
            updateScores();
            updateTeamUI();
            loadQuestion(0);
            showTurnPopup(); // Tampilkan popup giliran saat mulai
            
            // Allow Enter key to trigger check
            elInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') checkAnswer();
            });

            // Start Audio Context on first interaction
            document.body.addEventListener('click', () => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }, { once: true });
        }

        function loadQuestion(index) {
            const q = questionsData[index];
            currentRevealed = [false, false, false, false, false];
            resetStrikes();
            
            elQuestionIndicator.innerText = `SOAL ${index + 1} DARI ${questionsData.length}`;
            elQuestionText.innerText = q.question;
            elInput.value = "";
            elInput.focus();

            // Check if it's the last question
            if (index === questionsData.length - 1) {
                document.getElementById('btn-next').innerText = "SELESAI & HASIL 🏆";
                document.getElementById('btn-next').classList.replace('bg-purple-600', 'bg-green-600');
                document.getElementById('btn-next').classList.replace('border-purple-800', 'border-green-800');
            }

            // Generate Cards
            elAnswersContainer.innerHTML = '';
            q.answers.forEach((ans, i) => {
                const cardHTML = `
                    <div class="h-16 w-full perspective cursor-default">
                        <div id="card-${i}" class="w-full h-full relative preserve-3d">
                            <!-- Front of Card (Closed) -->
                            <div class="absolute w-full h-full backface-hidden bg-gradient-to-r from-blue-800 to-blue-900 rounded-xl border-2 border-blue-500/50 flex items-center shadow-md">
                                <div class="w-16 h-full border-r-2 border-blue-500/50 flex items-center justify-center text-3xl font-black text-blue-200 bg-black/20 rounded-l-lg">
                                    ${i + 1}
                                </div>
                                <div class="flex-1"></div>
                                <div class="w-20 h-full border-l-2 border-blue-500/50 flex items-center justify-center text-2xl font-bold text-yellow-400 bg-black/20 rounded-r-lg">
                                    ${ans.points}
                                </div>
                            </div>
                            <!-- Back of Card (Revealed) -->
                            <div class="absolute w-full h-full backface-hidden rotate-x-180 bg-gradient-to-r from-yellow-400 to-yellow-500 rounded-xl border-2 border-yellow-200 flex items-center shadow-[0_0_15px_rgba(250,204,21,0.5)]">
                                <div class="flex-1 px-6 text-xl font-bold text-yellow-950 uppercase drop-shadow-sm line-clamp-1">
                                    ${ans.text}
                                </div>
                                <div class="w-20 h-full border-l-2 border-yellow-600/30 flex items-center justify-center text-3xl font-black text-yellow-950 bg-black/10 rounded-r-lg">
                                    ${ans.points}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                elAnswersContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        /* --- GAME LOGIC --- */
        function updateTeamUI() {
            if (activeTeam === 1) {
                elT1Panel.classList.add('team-active');
                elT1Panel.classList.remove('team-inactive');
                elT2Panel.classList.add('team-inactive');
                elT2Panel.classList.remove('team-active');
            } else {
                elT2Panel.classList.add('team-active');
                elT2Panel.classList.remove('team-inactive');
                elT1Panel.classList.add('team-inactive');
                elT1Panel.classList.remove('team-active');
            }
        }

        function switchTeam() {
            activeTeam = activeTeam === 1 ? 2 : 1;
            updateTeamUI();
            showTurnPopup();
            elInput.focus();
        }

        function showTurnPopup() {
            const popup = document.getElementById('turn-popup');
            const content = document.getElementById('turn-popup-content');
            
            // Hapus timeout sebelumnya jika ada agar tidak tumpang tindih
            if(turnPopupTimeout) clearTimeout(turnPopupTimeout);
            
            if (activeTeam === 1) {
                content.innerText = "GILIRAN TIM 1";
                content.className = "text-6xl md:text-8xl font-black text-blue-50 px-12 py-8 rounded-3xl border-8 border-blue-400 bg-blue-600/95 shadow-[0_0_80px_rgba(96,165,250,0.9)] transform scale-0 transition-transform duration-300 backdrop-blur-md text-center drop-shadow-xl";
            } else {
                content.innerText = "GILIRAN TIM 2";
                content.className = "text-6xl md:text-8xl font-black text-rose-50 px-12 py-8 rounded-3xl border-8 border-rose-400 bg-rose-600/95 shadow-[0_0_80px_rgba(251,113,133,0.9)] transform scale-0 transition-transform duration-300 backdrop-blur-md text-center drop-shadow-xl";
            }

            popup.classList.remove('hidden');
            
            // Trigger animasi masuk
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    content.classList.remove('scale-0');
                    content.classList.add('scale-100');
                });
            });

            // Sembunyikan otomatis setelah 2 detik
            turnPopupTimeout = setTimeout(() => {
                content.classList.remove('scale-100');
                content.classList.add('scale-0');
                setTimeout(() => {
                    popup.classList.add('hidden');
                }, 300); // Menunggu transisi selesai
            }, 2000);
        }

        function updateScores() {
            elT1Score.innerText = team1Score;
            elT2Score.innerText = team2Score;
        }

        // Add Points with Animation
        function addPoints(points) {
            const anchorId = activeTeam === 1 ? 't1-point-anchor' : 't2-point-anchor';
            const anchor = document.getElementById(anchorId);
            
            // Update Data
            if (activeTeam === 1) team1Score += points;
            else team2Score += points;
            
            updateScores();

            // Float Animation
            const floatEl = document.createElement('div');
            floatEl.className = 'point-float';
            floatEl.innerText = `+${points}`;
            anchor.appendChild(floatEl);
            
            setTimeout(() => {
                if(anchor.contains(floatEl)) anchor.removeChild(floatEl);
            }, 1000);
        }

        function checkAnswer() {
            const inputVal = elInput.value.trim().toLowerCase();
            if (!inputVal) return;

            const q = questionsData[currentQuestionIndex];
            let foundIndex = -1;

            // Fuzzy Match
            for (let i = 0; i < q.answers.length; i++) {
                if (currentRevealed[i]) continue; // Skip already revealed
                
                const keywords = q.answers[i].keywords;
                // Check if any keyword is included in the input
                if (keywords.some(kw => inputVal.includes(kw.toLowerCase()))) {
                    foundIndex = i;
                    break;
                }
            }

            if (foundIndex !== -1) {
                // Correct
                revealAnswer(foundIndex, true);
                elInput.value = "";
            } else {
                // Wrong - show modal but don't clear input immediately in case of typo
                markWrong();
            }
            elInput.focus();
        }

        function revealAnswer(index, withPoints) {
            if (currentRevealed[index]) return; // Prevent double trigger
            
            currentRevealed[index] = true;
            const card = document.getElementById(`card-${index}`);
            
            // Flip Animation
            card.classList.add('rotate-x-180');
            
            if (withPoints) {
                playCorrectSound();
                addPoints(questionsData[currentQuestionIndex].answers[index].points);
            }
        }

        // Manual Reveal from Buttons (Gives Points)
        function manualReveal(index) {
            if(index >= 0 && index < 5 && !currentRevealed[index]){
                revealAnswer(index, true);
            }
        }

        // Reveal remaining answers without points
        function revealAllNoPoints() {
            for (let i = 0; i < 5; i++) {
                if (!currentRevealed[i]) {
                    revealAnswer(i, false);
                }
            }
        }

        function markWrong() {
            playWrongSound();
            
            // Show Big X Overlay
            const overlay = document.getElementById('big-x-overlay');
            overlay.style.display = 'block';
            overlay.classList.add('animate-pop-in');
            
            setTimeout(() => {
                overlay.style.display = 'none';
                overlay.classList.remove('animate-pop-in');
            }, 1000);

            // Add Strike
            if (activeTeam === 1) {
                if (team1Strikes < 3) {
                    team1Strikes++;
                    document.getElementById(`t1-strike-${team1Strikes}`).classList.add('active');
                }
                if (team1Strikes >= 3) flashTeamWarning(elT1Panel);
            } else {
                if (team2Strikes < 3) {
                    team2Strikes++;
                    document.getElementById(`t2-strike-${team2Strikes}`).classList.add('active');
                }
                if (team2Strikes >= 3) flashTeamWarning(elT2Panel);
            }
            elInput.value = "";
            elInput.focus();

            // Auto-switch team when the answer is wrong (after 1 second delay to let animation finish)
            setTimeout(() => {
                switchTeam();
            }, 1000);
        }

        function flashTeamWarning(panel) {
            panel.style.borderColor = '#ef4444'; // Red
            panel.style.boxShadow = '0 0 30px rgba(239, 68, 68, 0.8)';
            setTimeout(() => {
                panel.style.borderColor = '';
                panel.style.boxShadow = '';
                updateTeamUI(); // restore normal active state glow
            }, 1500);
        }

        function resetStrikes() {
            team1Strikes = 0;
            team2Strikes = 0;
            for(let i=1; i<=3; i++){
                document.getElementById(`t1-strike-${i}`).classList.remove('active');
                document.getElementById(`t2-strike-${i}`).classList.remove('active');
            }
            updateTeamUI();
        }

        function nextQuestion() {
            if (currentQuestionIndex < questionsData.length - 1) {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
            } else {
                showWinModal();
            }
        }

        /* --- END GAME & CONFETTI --- */
        function showWinModal() {
            const modal = document.getElementById('win-modal');
            const content = document.getElementById('win-modal-content');
            
            document.getElementById('final-score-1').innerText = team1Score;
            document.getElementById('final-score-2').innerText = team2Score;
            
            const ann = document.getElementById('winner-announcement');
            if (team1Score > team2Score) {
                ann.innerText = "TIM 1 MENANG!";
                ann.className = "text-5xl font-black text-blue-400 mb-10 animate-bounce text-center drop-shadow-[0_0_20px_rgba(96,165,250,0.8)]";
            } else if (team2Score > team1Score) {
                ann.innerText = "TIM 2 MENANG!";
                ann.className = "text-5xl font-black text-rose-400 mb-10 animate-bounce text-center drop-shadow-[0_0_20px_rgba(251,113,133,0.8)]";
            } else {
                ann.innerText = "HASIL SERI!";
                ann.className = "text-5xl font-black text-white mb-10 animate-bounce text-center drop-shadow-[0_0_20px_rgba(255,255,255,0.8)]";
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-0');
                content.classList.add('scale-100');
            }, 50);

            playWinSound();
            startConfetti();
        }

        function resetGameModal() {
            if(confirm("Apakah Anda yakin ingin mereset permainan dari awal?")) {
                resetGame();
            }
        }

        function resetGame() {
            const modal = document.getElementById('win-modal');
            const content = document.getElementById('win-modal-content');
            
            content.classList.remove('scale-100');
            content.classList.add('scale-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                stopConfetti();
                
                // Reset Next Button Style
                const btnNext = document.getElementById('btn-next');
                btnNext.innerText = "SOAL BERIKUTNYA ⏭";
                btnNext.className = "bg-purple-600 hover:bg-purple-500 text-white font-bold px-6 py-2 rounded-xl shadow-lg border-b-4 border-purple-800 animate-pulse";
                
                initGame();
            }, 500);
        }

        /* --- CONFETTI LOGIC --- */
        let confettiInterval;
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        function createParticles() {
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 2,
                    dx: Math.random() * 4 - 2,
                    dy: Math.random() * 5 + 2,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }
        }

        function drawConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                
                if (p.y > canvas.height) {
                    particles[index] = { ...p, x: Math.random() * canvas.width, y: -20, tilt: Math.floor(Math.random() * 10) - 10 };
                }

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctx.stroke();
            });
        }

        function startConfetti() {
            particles = [];
            createParticles();
            if(confettiInterval) clearInterval(confettiInterval);
            confettiInterval = setInterval(drawConfetti, 20);
        }

        function stopConfetti() {
            clearInterval(confettiInterval);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        /* --- FULLSCREEN LOGIC --- */
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const expandIcon = document.getElementById('fs-icon-expand');
            const compressIcon = document.getElementById('fs-icon-compress');
            if (document.fullscreenElement) {
                expandIcon.classList.add('hidden');
                compressIcon.classList.remove('hidden');
            } else {
                expandIcon.classList.remove('hidden');
                compressIcon.classList.add('hidden');
            }
        });

        // Start App by showing Subject Selection
        window.onload = showGradeSelection;

    </script>
</body>
</html>
